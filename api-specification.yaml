openapi: 3.0.3
info:
  title: DPV Control API
  description: |
    REST API for the DPV (Diver Propulsion Vehicle) Control System.
    
    This API provides access to system status, sensor data, trip logs, and configuration settings
    for the ESP32-based DPV controller with VESC motor control.
    
    **Key Features:**
    - Real-time system status and sensor readings
    - Historical data logging and retrieval
    - Configuration management with export/import
    - Trip log download functionality
  version: 1.0.1
  contact:
    name: DPV Control Project
    url: https://bubtec.de/2024/10/29/diy-scooter-dpv-mit-aquazepp-und-dpvcontrol/
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://4.3.2.1
    description: DPV Control Device (Captive Portal)
  - url: http://192.168.4.1
    description: DPV Control Device (AP Mode)

tags:
  - name: Status
    description: System status and real-time data
  - name: Data
    description: Sensor data and logging
  - name: Settings
    description: Device configuration
  - name: Control
    description: Motor and lamp control
  - name: Trip Log
    description: Historical trip data

paths:
  /api/status:
    get:
      tags:
        - System
      summary: Get system status
      description: Returns current system status information including operational status, uptime, and sensor data
      responses:
        '200':
          description: System status information
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime:
                    type: integer
                    description: Current system uptime in milliseconds
                    example: 3654000
                  totalUptime:
                    type: integer
                    description: Total device operating time in seconds
                    example: 12345
                  dataPoints:
                    type: integer
                    description: Number of data points in current recording buffer
                    example: 120
                  isDataloggerRunning:
                    type: boolean
                    description: Whether the datalogger is currently recording
                    example: true
                  waterSensorFront:
                    type: boolean
                    description: Front water sensor state (true if leak detected)
                    example: false
                  waterSensorBack:
                    type: boolean
                    description: Back water sensor state (true if leak detected)
                    example: false
                  leftButton:
                    type: boolean
                    description: Left button state (true if pressed)
                    example: false
                  rightButton:
                    type: boolean
                    description: Right button state (true if pressed)
                    example: false
                  lampLevel:
                    type: integer
                    description: Current lamp brightness level
                    example: 2
                  beeperEnabled:
                    type: boolean
                    description: Whether the beeper is enabled
                    example: true
                  erpm:
                    type: number
                    description: Current motor speed in electrical RPM
                    example: 12500
                  motorTemp:
                    type: number
                    description: Motor temperature in Celsius
                    example: 42.5
                  mosfetTemp:
                    type: number
                    description: MOSFET temperature in Celsius
                    example: 38.2
                  inputVoltage:
                    type: number
                    description: Current input voltage
                    example: 14.8
                  avgInputCurrent:
                    type: number
                    description: Average input current in Amperes
                    example: 15.3
                  avgMotorCurrent:
                    type: number
                    description: Average motor current in Amperes
                    example: 20.1
                  dutyCycle:
                    type: number
                    description: Current duty cycle (0.0 to 1.0)
                    example: 0.75
                  motorState:
                    type: integer
                    description: Current motor state (0=Standby, 1=On, 2=Off, 3=Cruise, 4=Turbo, 5=Jammed)
                    example: 1
              example:
                uptime: 3654000
                totalUptime: 12345
                dataPoints: 120
                isDataloggerRunning: true
                waterSensorFront: false
                waterSensorBack: false
                leftButton: false
                rightButton: false
                lampLevel: 2
                beeperEnabled: true
                erpm: 12500
                motorTemp: 42.5
                mosfetTemp: 38.2
                inputVoltage: 14.8
                avgInputCurrent: 15.3
                avgMotorCurrent: 20.1
                dutyCycle: 0.75
                motorState: 1

  /api/data:
    get:
      tags:
        - Data
      summary: Get sensor data points
      description: |
        Retrieve recent sensor data points with optional filtering by count and time range.
        Data includes battery voltage, temperatures, currents, eRPM, and other sensor readings.
      parameters:
        - name: count
          in: query
          description: Number of data points to retrieve (1-500)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 60
        - name: range
          in: query
          description: Time range for data retrieval
          required: false
          schema:
            type: string
            enum: [recent, hourly, historical]
            default: recent
      responses:
        '200':
          description: Array of sensor data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataPoint'
              example:
                - timestamp: 129784
                  tempMotor: 21.0
                  tempMosfet: 22.8
                  batteryVoltage: 52.5
                  current: 0.0
                  avgMotorCurrent: 0.0
                  eRPM: 0
                  dutyCycle: 0.0
                  temperature: 22.5
                  humidity: 65.2
                  batteryLevel: 85
                  leakSensorState: 0
                  ledState: 0
                  totalUptime: 5649

  /api/trip-log:
    get:
      tags:
        - Trip Log
      summary: Download complete trip log
      description: |
        Download the complete trip log as JSON containing all recorded data points.
        This can be a large file depending on the logging duration.
      responses:
        '200':
          description: Complete trip log data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataPoint'

  /api/settings:
    get:
      tags:
        - Settings
      summary: Get current device settings
      description: Retrieve all configurable device parameters including motor settings, LED configuration, and system preferences
      responses:
        '200':
          description: Current device settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSettings'
    
    post:
      tags:
        - Settings
      summary: Update device settings
      description: |
        Update device configuration. All settings are validated before being saved.
        Invalid settings will be rejected with an error response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSettings'
      responses:
        '200':
          description: Settings update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true

  /api/settings/restore:
    post:
      tags:
        - Settings
      summary: Restore default settings
      description: Reset all device settings to their default values
      responses:
        '200':
          description: Restore operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true

  /api/reboot:
    post:
      tags:
        - Control
      summary: Reboot the system
      description: |
        Initiate a system reboot. This will restart the ESP32 controller.
        All active sessions will be terminated and the device will be unavailable for about 30 seconds.
      responses:
        '200':
          description: Reboot initiation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        description: Confirmation message
              example:
                success: true
                message: "Reboot initiated"

  /api/beeper:
    post:
      tags:
        - Settings
      summary: Update beeper setting (legacy)
      description: |
        Legacy endpoint for updating beeper setting only.
        Prefer using /api/settings for comprehensive configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
      responses:
        '200':
          description: Beeper setting update result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      enabled:
                        type: boolean

  /api/sessions:
    get:
      tags:
        - Data
      summary: List all available sessions
      description: |
        Retrieve a list of all recorded session files with metadata.
        Sessions are sorted with newest first and grouped by session number.
      responses:
        '200':
          description: Array of available sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
              example:
                - filename: "session_0003.bin"
                  displayName: "Session 0003 (Current)"
                  sessionNumber: "0003"
                  splitInfo: ""
                  isCurrent: true
                - filename: "session_0002-02.bin"
                  displayName: "Session 0002 (Part 02)"
                  sessionNumber: "0002"
                  splitInfo: "02"
                  isCurrent: false

  /api/session-data:
    get:
      tags:
        - Data
      summary: Get data from specific session
      description: |
        Retrieve sensor data from a specific session file.
        Limited to 500 data points to prevent memory issues.
      parameters:
        - name: session
          in: query
          description: Session filename to retrieve data from
          required: true
          schema:
            type: string
          example: "session_0003.bin"
      responses:
        '200':
          description: Array of sensor data points from the session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataPoint'
        '400':
          description: Missing session parameter
          content:
            text/plain:
              schema:
                type: string
                example: "Missing session parameter"

  /api/session-csv:
    get:
      tags:
        - Data
      summary: Get CSV data from specific session (streaming)
      description: |
        Retrieve sensor data from a specific session file in CSV format 
        with Windows line endings (CRLF) for better Excel compatibility.
        Uses streaming technology to handle sessions of any size without ESP32 memory limitations.
        Total Uptime (s) is used as the primary time reference instead of absolute timestamps.
        
        For large sessions (>100 data points), data is streamed directly to prevent memory overflow.
        Maximum export limit: 10,000 data points per session.
      parameters:
        - name: session
          in: query
          description: Session filename to retrieve CSV data from
          required: true
          schema:
            type: string
          example: "session_0003.bin"
      responses:
        '200':
          description: CSV data from the session with streaming download headers
          headers:
            Content-Type:
              schema:
                type: string
                example: "text/csv"
            Content-Disposition:
              schema:
                type: string
                example: "attachment; filename=\"session_0003.csv\""
          content:
            text/csv:
              schema:
                type: string
                description: |
                  CSV format with columns:
                  Total Uptime (s), Motor Temperature (degC), MOSFET Temperature (degC), 
                  Battery Voltage (V), Input Current (A), Motor Current (A), RPM, 
                  Duty Cycle (%), Ambient Temperature (degC), Humidity (%), 
                  Battery Level (%), Leak Sensor State, LED State
                  
                  Data is streamed row by row to handle large sessions efficiently.
              example: |
                Total Uptime (s),Motor Temperature (degC),MOSFET Temperature (degC),Battery Voltage (V),Input Current (A),Motor Current (A),RPM,Duty Cycle (%),Ambient Temperature (degC),Humidity (%),Battery Level (%),Leak Sensor State,LED State
                12.7,25.5,25.3,49.995,0.00,0.00,0,0.000,16.7,40.8,65,0,0
                27.8,25.4,29.1,50.573,11.03,19.67,1250,0.673,16.7,40.8,65,0,0
        '404':
          description: Session file not found
          content:
            text/plain:
              schema:
                type: string
                example: "Error: Could not open session file session_0003.bin"

  /api/motor:
    post:
      tags:
        - Control
      summary: Control motor operation
      description: |
        Control motor operation with enable/disable functionality and speed percentage.
        The enabled parameter controls whether the motor is active, and speed sets the power level.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether the motor should be enabled
                  default: false
                speed:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Motor speed percentage (0% = minimum, 100% = maximum power)
                action:
                  type: string
                  enum: [speed_up, speed_down, stop, emergency_stop]
                  description: Motor control action to perform (legacy compatibility)
              required:
                - enabled
              example:
                enabled: true
                speed: 50
      responses:
        '200':
          description: Motor control result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Whether the motor is enabled
                      speed:
                        type: integer
                        description: Current motor speed percentage
                      motorStep:
                        type: integer
                        description: Current motor speed step (internal)
                      currentSpeed:
                        type: integer
                        description: Current motor speed step (legacy)
                      motorState:
                        type: string
                        description: Current motor state
              example:
                success: true
                enabled: true
                speed: 50
                motorStep: 5

  /api/lamp:
    post:
      tags:
        - Control
      summary: Control front lamp
      description: |
        Adjust the brightness of the front LED lamp using percentage values.
        0% turns the lamp off, 1-100% are mapped dynamically to the configured brightness levels.
        The number of levels and their brightness values are configurable via the settings system.
        Percentage ranges are automatically calculated: For N levels, 1-(100/N)% = level 1, (100/N+1)-100% = level N.
        Example: 3 levels (OFF + 2 brightness): 1-50% → level 1, 51-100% → level 2
        Example: 5 levels (OFF + 4 brightness): 1-25% → level 1, 26-50% → level 2, 51-75% → level 3, 76-100% → level 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether the lamp should be enabled
                  default: true
                level:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Lamp brightness percentage (0% = off, 100% = maximum brightness)
              required:
                - level
              example:
                enabled: true
                level: 50
      responses:
        '200':
          description: Lamp control result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Whether the lamp is enabled
                      level:
                        type: integer
                        description: Current lamp level percentage (0-100%)
                      percentage:
                        type: integer
                        description: Current lamp percentage (same as level)
                      actualLevel:
                        type: integer
                        description: Internal brightness level used by hardware (0=OFF, 1 to maxLevels-1 for brightness levels)
              example:
                success: true
                enabled: true
                level: 50
                percentage: 50
                actualLevel: 1

  /api/version:
    get:
      tags:
        - Status
      summary: Get firmware version
      description: |
        Retrieve the current firmware version information.
        Version is read from version.txt file or defaults to 2.0.0.
      responses:
        '200':
          description: Current firmware version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    description: Firmware version string
                required:
                  - version
              example:
                version: "2.0.0"

  /api/delete-all-sessions:
    post:
      tags:
        - Data
      summary: Delete all session files
      description: |
        Delete all recorded session files from the device storage.
        This operation cannot be undone. Use with caution.
      responses:
        '200':
          description: Deletion operation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      deleted:
                        type: integer
                        description: Number of files successfully deleted
                      message:
                        type: string
                        description: Detailed result message
                      error:
                        type: string
                        description: Error message if operation failed
              example:
                success: true
                deleted: 5
                message: "Successfully deleted 5 session files"

components:
  schemas:
    SystemStatus:
      type: object
      properties:
        uptime:
          type: integer
          description: System uptime in milliseconds since last boot
          example: 129752
        totalUptime:
          type: integer
          description: Total accumulated uptime in seconds across all boots
          example: 5649
        dataPoints:
          type: integer
          description: Number of data points currently in memory buffer
          example: 100
        isDataloggerRunning:
          type: boolean
          description: Whether the data logging system is active
          example: true
        waterSensorFront:
          type: boolean
          description: Front water leak sensor state (true = leak detected)
          example: false
        waterSensorBack:
          type: boolean
          description: Back water leak sensor state (true = leak detected)
          example: false
        leftButton:
          type: boolean
          description: Left control button state (true = pressed)
          example: false
        rightButton:
          type: boolean
          description: Right control button state (true = pressed)
          example: false
        lampLevel:
          type: integer
          description: Current front lamp brightness percentage (0% = off, 100% = maximum)
          minimum: 0
          maximum: 100
          example: 0
        beeperEnabled:
          type: boolean
          description: Whether the beeper is enabled
          example: false

    DataPoint:
      type: object
      properties:
        timestamp:
          type: integer
          description: Timestamp in milliseconds since device boot
          example: 129784
        tempMotor:
          type: number
          format: float
          description: Motor temperature in Celsius
          example: 21.0
        tempMosfet:
          type: number
          format: float
          description: MOSFET temperature in Celsius
          example: 22.8
        batteryVoltage:
          type: number
          format: float
          description: Battery voltage in Volts
          example: 52.5
        current:
          type: number
          format: float
          description: Input current in Amperes
          example: 0.0
        avgMotorCurrent:
          type: number
          format: float
          description: Average motor current in Amperes
          example: 0.0
        eRPM:
          type: number
          format: float
          description: Motor eRPM (revolutions per minute)
          example: 0
        dutyCycle:
          type: number
          format: float
          description: Motor duty cycle as percentage
          example: 0.0
        temperature:
          type: number
          format: float
          description: Ambient temperature in Celsius
          example: 22.5
        humidity:
          type: number
          format: float
          description: Ambient humidity as percentage
          example: 65.2
        batteryLevel:
          type: integer
          description: Battery level as percentage
          minimum: 0
          maximum: 100
          example: 85
        leakSensorState:
          type: integer
          description: Water leak sensor state (0 = no leak, 1 = leak detected)
          example: 0
        ledState:
          type: integer
          description: LED state indicator
          example: 0
        totalUptime:
          type: integer
          description: Total uptime in seconds at time of measurement
          example: 5649

    DeviceSettings:
      type: object
      properties:
        # Motor and Speed Settings
        speedSteps:
          type: integer
          description: Number of speed steps (1-20)
          minimum: 1
          maximum: 20
          example: 10
        standbyDelaySeconds:
          type: integer
          description: Standby delay in seconds (10-600)
          minimum: 10
          maximum: 600
          example: 60
        batteryPowerMax:
          type: integer
          description: Maximum battery power in Amperes (10-100)
          minimum: 10
          maximum: 100
          example: 40
        minSpeedPercent:
          type: number
          format: float
          description: Minimum speed as percentage (0.1-1.0)
          minimum: 0.1
          maximum: 1.0
          example: 0.38
        maxSpeedRpm:
          type: number
          format: float
          description: Maximum speed in eRPM (1000-50000)
          minimum: 1000
          maximum: 50000
          example: 15800
        speedUpTimeMs:
          type: integer
          description: Speed up time in milliseconds (100-10000)
          minimum: 100
          maximum: 10000
          example: 3000
        speedDownTimeMs:
          type: integer
          description: Speed down time in milliseconds (50-5000)
          minimum: 50
          maximum: 5000
          example: 500
        maxTimeOverloadedMs:
          type: integer
          description: Maximum overload time in milliseconds (1000-30000)
          minimum: 1000
          maximum: 30000
          example: 5000
        
        # Jam Detection
        jamMin:
          type: number
          format: float
          description: Minimum jam detection threshold (0.05-0.5)
          minimum: 0.05
          maximum: 0.5
          example: 0.2
        jamDetectionThreshold:
          type: number
          format: float
          description: Jam detection threshold (0.1-1.0)
          minimum: 0.1
          maximum: 1.0
          example: 0.5
        
        # Battery Settings
        cellsInSeries:
          type: integer
          description: Number of battery cells in series (1-20)
          minimum: 1
          maximum: 20
          example: 13
        
        # LED Bar Settings
        ledBarNum:
          type: integer
          description: Number of LEDs in bar (1-50)
          minimum: 1
          maximum: 50
          example: 10
        ledBarBrightness:
          type: integer
          description: LED bar brightness (1-255)
          minimum: 1
          maximum: 255
          example: 15
        ledBarBrightnessSecond:
          type: integer
          description: LED bar secondary brightness (1-255)
          minimum: 1
          maximum: 255
          example: 3
        ledFrequency:
          type: integer
          description: LED frequency in Hz (100-10000)
          minimum: 100
          maximum: 10000
          example: 960
        
        # Lamp Settings
        lampMaxLevels:
          type: integer
          description: Number of lamp brightness levels including OFF (2-10)
          minimum: 2
          maximum: 10
          example: 3
        lampBrightness:
          type: array
          description: Array of brightness values for each lamp level (Level 0 must be 0 for OFF)
          items:
            type: integer
            minimum: 0
            maximum: 255
          minItems: 10
          maxItems: 10
          example: [0, 50, 200, 0, 0, 0, 0, 0, 0, 0]
        
        # WiFi Settings
        wifiSSID:
          type: string
          description: WiFi SSID (max 31 characters)
          maxLength: 31
          example: "DPVControl"
        wifiPassword:
          type: string
          description: WiFi password (max 31 characters)
          maxLength: 31
          example: "DPVControl"
        
        # System Settings
        beeperEnabled:
          type: boolean
          description: Whether the beeper is enabled
          example: true
        standbyBlinkStartMinutes:
          type: integer
          description: Standby blink start time in minutes (1-60)
          minimum: 1
          maximum: 60
          example: 15
        standbyBlinkDurationSeconds:
          type: integer
          description: Standby blink duration in seconds (1-60)
          minimum: 1
          maximum: 60
          example: 10

    SessionInfo:
      type: object
      properties:
        filename:
          type: string
          description: Original session filename
          example: "session_0003.bin"
        displayName:
          type: string
          description: Human-readable session name
          example: "Session 0003 (Current)"
        sessionNumber:
          type: string
          description: Session number extracted from filename
          example: "0003"
        splitInfo:
          type: string
          description: Split part information for multi-part sessions
          example: "02"
        isCurrent:
          type: boolean
          description: Whether this is the currently active session
          example: true
      required:
        - filename
        - displayName
        - sessionNumber
        - splitInfo
        - isCurrent

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
        message:
          type: string
          description: Optional message with additional information
      required:
        - success

  securitySchemes: {}

security: [] 
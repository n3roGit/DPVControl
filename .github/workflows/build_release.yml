name: Build and Version

on:
  push:
    branches:
      - main
      - production_repo
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'data/chart.min.js'
      - 'data/jszip.min.js'
      - '!data/version.txt'
      - '!src/**/*.md'
      - '!**/*.png'
      - '!**/*.jpg'
      - '!**/*.jpeg'

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Super-Linter
        uses: github/super-linter@v5
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: ./
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_CPP: true
          VALIDATE_CPP_CPPLINT: true
          VALIDATE_CPP_CPPCHECK: true

  build-and-version:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run

      - name: Run Unit Tests
        run: pio test -e native

      - name: Determine and increment version
        id: version
        run: |
          CURRENT_VERSION=$(cat data/version.txt || echo "2.0.0")
          echo "Current version: $CURRENT_VERSION"
          
          # Split version into parts
          IFS='.' read -ra PARTS <<< "$CURRENT_VERSION"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "New version: $NEW_VERSION"
          echo "$NEW_VERSION" > data/version.txt
          
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version file
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production_repo'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/version.txt
          git commit -m "Auto-increment version to ${NEW_VERSION}" || exit 0
          git push

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production_repo'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            .pio/build/*/*.bin
          draft: false
          prerelease: false

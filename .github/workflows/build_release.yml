---
name: Build and Version

on:
  push:
    branches:
      - main
      - production_repo
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'upload/**'
      - 'embed_webfiles.py'
      - 'extra_script.py'
      - '!upload/version.txt'
      - '!src/**/*.md'
      - '!**/*.png'
      - '!**/*.jpg'  
      - '!**/*.jpeg'

jobs:
  build-and-version:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: |
          echo "🔧 Starting PlatformIO build..."
          pio run -e esp32dev --verbose
          BUILD_EXIT_CODE=$?
          echo "Build exit code: $BUILD_EXIT_CODE"
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code $BUILD_EXIT_CODE"
            exit $BUILD_EXIT_CODE
          else
            echo "✅ Build completed successfully"
          fi

      - name: Debug Build Directory
        run: |
          echo "Listing contents of .pio/build/esp32dev/:"
          ls -la .pio/build/esp32dev/ || echo "Build directory not found"
          echo "Checking for specific files:"
          [ -f .pio/build/esp32dev/firmware.bin ] && echo "✓ firmware.bin found" || echo "✗ firmware.bin missing"
          [ -f .pio/build/esp32dev/bootloader.bin ] && echo "✓ bootloader.bin found" || echo "✗ bootloader.bin missing"
          [ -f .pio/build/esp32dev/partitions.bin ] && echo "✓ partitions.bin found" || echo "✗ partitions.bin missing"

      - name: Verify Build Artifacts
        run: |
          echo "🔍 Verifying build artifacts..."
          echo "Working directory: $(pwd)"
          echo "Build directory contents:"
          find .pio/build/esp32dev/ -type f -name "*.bin" -ls 2>/dev/null || echo "No .bin files found in build directory"
          echo ""
          
          MISSING_FILES=""
          
          if [ ! -f .pio/build/esp32dev/firmware.bin ]; then
            echo "❌ ERROR: firmware.bin not found!"
            MISSING_FILES="${MISSING_FILES} firmware.bin"
          else
            echo "✅ firmware.bin found ($(stat -c%s .pio/build/esp32dev/firmware.bin) bytes)"
          fi
          
          if [ ! -f .pio/build/esp32dev/bootloader.bin ]; then
            echo "❌ ERROR: bootloader.bin not found!"
            MISSING_FILES="${MISSING_FILES} bootloader.bin"
          else
            echo "✅ bootloader.bin found ($(stat -c%s .pio/build/esp32dev/bootloader.bin) bytes)"
          fi
          
          if [ ! -f .pio/build/esp32dev/partitions.bin ]; then
            echo "❌ ERROR: partitions.bin not found!"
            MISSING_FILES="${MISSING_FILES} partitions.bin"
          else
            echo "✅ partitions.bin found ($(stat -c%s .pio/build/esp32dev/partitions.bin) bytes)"
          fi
          
          if [ ! -z "${MISSING_FILES}" ]; then
            echo ""
            echo "💥 CRITICAL: Missing build artifacts:${MISSING_FILES}"
            echo "This indicates that the PlatformIO build process failed to produce binaries."
            echo "The build may have stopped early due to compilation errors."
            echo "Check the 'Build PlatformIO Project' step output above for detailed errors."
            echo ""
            echo "🔧 Possible causes:"
            echo "  - Compilation errors in C++ code"
            echo "  - Missing dependencies or includes"
            echo "  - embed_webfiles.py script failures"
            echo "  - PlatformIO configuration issues"
            echo ""
            exit 1
          else
            echo ""
            echo "🎉 All build artifacts found successfully!"
            echo "Ready to proceed with release creation."
          fi

      - name: Run Unit Tests
        run: pio test -e native

      - name: Determine and increment version
        id: version
        run: |
          # Version is now created in upload/ during the build process
          # Read current version from upload/version.txt (created by embed_webfiles.py)
          if [ -f upload/version.txt ]; then
            CURRENT_VERSION=$(cat upload/version.txt)
            echo "Current version from build: ${CURRENT_VERSION}"
          else
            echo "ERROR: No version file found - build process may have failed"
            echo "Expected file: upload/version.txt"
            CURRENT_VERSION="no version found"
            echo "VERSION=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          # Validate version format (should be x.y.z)
          if [[ ! "${CURRENT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: ${CURRENT_VERSION}"
            echo "Expected format: x.y.z (e.g., 2.0.1)"
            exit 1
          fi
          
          # Split version into parts
          IFS='.' read -ra PARTS <<< "${CURRENT_VERSION}"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "New version: ${NEW_VERSION}"
          # Ensure upload directory exists and update version file
          mkdir -p upload
          echo "${NEW_VERSION}" > upload/version.txt
          
          echo "VERSION=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version files
        if: >-
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/production_repo'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add upload/version.txt
          git commit -m "Auto-increment version to ${{ steps.version.outputs.version }}" || exit 0
          git push

      - name: Generate Release Notes
        if: >-
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/production_repo'
        id: release_notes
        run: |
          python buildprocess/generate_release_notes.py \
            "${{ steps.version.outputs.version }}" > release_notes.md
          {
            echo "RELEASE_NOTES<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}

      - name: Create Release
        if: >-
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/production_repo'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          artifacts: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

---
name: Build and Version

on:
  push:
    branches:
      - main
      - production_repo
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'data/chart.min.js'
      - 'data/jszip.min.js'
      - '!data/version.txt'
      - '!src/**/*.md'
      - '!**/*.png'
      - '!**/*.jpg'
      - '!**/*.jpeg'

jobs:
  build-and-version:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install dependencies
        run: make install

      - name: Build PlatformIO Project
        run: make build

      - name: Verify Build Artifacts
        run: |
          if [ ! -f .pio/build/esp32dev/firmware.bin ]; then
            echo "firmware.bin not found!"
            exit 1
          fi
          if [ ! -f .pio/build/esp32dev/bootloader.bin ]; then
            echo "bootloader.bin not found!"
            exit 1
          fi
          if [ ! -f .pio/build/esp32dev/partitions.bin ]; then
            echo "partitions.bin not found!"
            exit 1
          fi

      - name: Run Unit Tests
        run: make test

      - name: Determine and increment version
        id: version
        run: |
          CURRENT_VERSION=$(cat data/version.txt || echo "2.0.0")
          echo "Current version: ${CURRENT_VERSION}"
          
          # Split version into parts
          IFS='.' read -ra PARTS <<< "${CURRENT_VERSION}"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "New version: ${NEW_VERSION}"
          echo "${NEW_VERSION}" > data/version.txt
          
          echo "VERSION=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version file
        if: >-
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/production_repo'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/version.txt
          git commit -m "Auto-increment version to ${{ steps.version.outputs.version }}" || exit 0
          git push

      - name: Generate Release Notes
        if: >-
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/production_repo'
        id: release_notes
        run: |
          python buildprocess/generate_release_notes.py \
            "${{ steps.version.outputs.version }}" > release_notes.md
          {
            echo "RELEASE_NOTES<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}

      - name: Create Release
        if: >-
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/production_repo'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          artifacts: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

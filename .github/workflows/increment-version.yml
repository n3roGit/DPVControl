name: Build and Version

on:
  push:
    branches:
      - main
      - production_repo
    paths:
      - 'DPVController/**'
      - 'src/**'
      - 'firmware/**'
      - 'web/**'
      - '!data/version.txt'

jobs:
  build-and-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run

      - name: Determine and increment version
        id: version
        run: |
          CURRENT_VERSION=$(cat data/version.txt || echo "2.0.0")
          echo "Current version: $CURRENT_VERSION"
          
          # Split version into parts
          IFS='.' read -ra PARTS <<< "$CURRENT_VERSION"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          echo "New version: $NEW_VERSION"
          echo "$NEW_VERSION" > data/version.txt
          
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit version file
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production_repo'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/version.txt
          git commit -m "Auto-increment version to ${{ env.VERSION }}" || exit 0
          git push

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production_repo'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.VERSION }}
          files: |
            .pio/build/*/*.bin
          draft: false
          prerelease: false

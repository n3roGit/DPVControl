name: Increment Version

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'DPVController/version.txt'

jobs:
  increment-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Increment version
        id: increment_version
        uses: mathieudutour/github-tag-action@v5.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          tag_prefix: ''

      - name: Update version file
        run: |
          mkdir -p DPVController
          echo "${{ steps.increment_version.outputs.new_tag }}" > DPVController/version.txt

      - name: Commit updated version
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add DPVController/version.txt
          git commit -m "Update version to ${{ steps.increment_version.outputs.new_tag }}" || exit 0
          git push origin main

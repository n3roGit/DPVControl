name: Increment Version

on:
  push:
    branches:
      - main
      - production_repo
    paths:
      - 'DPVController/**'
      - '!DPVController/version.txt'

jobs:
  versioning:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Increment version
        run: |
          CURRENT_VERSION=$(cat DPVController/version.txt || echo "0.0.0")
          NEW_VERSION=$(node -e "let v='$CURRENT_VERSION'.split('.'); v[2]++; console.log(v.join('.'))")
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo $NEW_VERSION > DPVController/version.txt
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$NEW_VERSION-$TIMESTAMP" >> $GITHUB_ENV

      - name: Push new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DPVController/version.txt
          git commit -m "Bump version to $NEW_VERSION"
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists. Skipping tagging."
          else
            git tag -a "$TAG_NAME" -m "Version $NEW_VERSION"
            git push origin HEAD --tags
          fi

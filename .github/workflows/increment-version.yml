name: Build and Version

on:
  push:
    branches:
      - main
      - production_repo
      - '**'
    paths:
      - 'DPVController/**'
      - '!DPVController/version.txt'

jobs:
  build-and-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build project
        run: |
          cd DPVController
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet publish -c Release --no-build -o ./publish

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/production_repo" ]]; then
            CURRENT_VERSION=$(cat DPVController/version.txt || echo "0.0.0")
            NEW_VERSION=$(node -e "let v='$CURRENT_VERSION'.split('.'); v[2]++; console.log(v.join('.'))")
            echo $NEW_VERSION > DPVController/version.txt
            echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
            echo "TAG_NAME=v$NEW_VERSION" >> $GITHUB_ENV
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            COMMIT_ID=$(git rev-parse --short HEAD)
            echo "VERSION=$BRANCH_NAME-$COMMIT_ID" >> $GITHUB_ENV
            echo "TAG_NAME=$BRANCH_NAME-$COMMIT_ID" >> $GITHUB_ENV
          fi

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production_repo'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.VERSION }}
          files: |
            DPVController/publish/**/*
          draft: false
          prerelease: false

      - name: Push version changes
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production_repo'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout ${{ github.ref }}
          git add DPVController/version.txt
          git commit -m "Bump version to ${VERSION}"
          git push origin HEAD
          git tag -f "$TAG_NAME" -m "Version $VERSION"
          git push -f origin "$TAG_NAME"

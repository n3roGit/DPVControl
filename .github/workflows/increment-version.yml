name: Build and Version

on:
  push:
    branches:
      - main
      - production_repo
      - '**'
    paths:
      - 'DPVController/**'
      - 'src/**'
      - 'firmware/**'
      - 'web/**'
      - '!DPVController/version.txt'

jobs:
  build-and-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/production_repo" ]]; then
            CURRENT_VERSION=$(cat DPVController/version.txt || echo "0.0.0")
            NEW_VERSION=$(python3 -c "v='$CURRENT_VERSION'.split('.'); v[2]=str(int(v[2])+1); print('.'.join(v))")
            echo $NEW_VERSION > DPVController/version.txt
            echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
            echo "TAG_NAME=v$NEW_VERSION" >> $GITHUB_ENV
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            COMMIT_ID=$(git rev-parse --short HEAD)
            echo "VERSION=$BRANCH_NAME-$COMMIT_ID" >> $GITHUB_ENV
            echo "TAG_NAME=$BRANCH_NAME-$COMMIT_ID" >> $GITHUB_ENV
          fi

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production_repo'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.VERSION }}
          files: |
            .pio/build/**/*
          draft: false
          prerelease: false

name: Build and Version

on:
  push:
    branches:
      - main
      - production_repo
    paths:
      - 'DPVController/**'
      - 'src/**'
      - 'firmware/**'
      - 'web/**'
      - '!DPVController/version.txt'

jobs:
  build-and-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run

      - name: Determine version
        id: version
        run: |
          VERSION=$(cat DPVController/version.txt || echo "0.0.0")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production_repo'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.VERSION }}
          files: |
            .pio/build/*/*.bin
          draft: false
          prerelease: false
